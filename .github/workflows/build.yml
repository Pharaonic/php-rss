name: Build

on:
  push:
    branches:
      - '8.*.x'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'

  pull_request:
    branches:
      - '8.*.x'

jobs:
  quality:
    name: Code quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Code style (PSR-12)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependencies }} dependencies

    needs: quality

    strategy:
      max-parallel: 2
      
      fail-fast: false

      matrix:
        php:
          - '8.1'
        os:
          - ubuntu-latest
          - windows-latest
        dependencies:
          - lowest
          - highest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: composer test
